<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minders Live</title>

    <script src="https://cdn.amplitude.com/script/149c1b2572d16bf0d4035a897f1abfca.js"></script>
    <script src="https://cdn.amplitude.com/script/149c1b2572d16bf0d4035a897f1abfca.engagement.js"></script>

    <script>
      window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 }));
      window.amplitude.add(window.engagement.plugin());

      let savedAmplitudeUserId;
      try {
        const savedUser = JSON.parse(localStorage.getItem("minders_user") || "null");
        if (savedUser && savedUser.role !== "anonymous" && savedUser.id) {
          savedAmplitudeUserId = savedUser.id;
        }
      } catch (error) {
        savedAmplitudeUserId = undefined;
      }

      const amplitudeConfig = {
        fetchRemoteConfig: true,
        autocapture: {
          attribution: {
            trackingMethod: ["userProperty", "eventProperty"],
            fallbackAttributionEvent: true,
            excludeInternalReferrers: { condition: "ifEmptyCampaign" }
          },
          pageViews: true,
          sessions: true,
          formInteractions: true,
          fileDownloads: true,
          elementInteractions: true,
          pageUrlEnrichment: true,
          frustrationInteractions: true,
          networkTracking: true,
          webVitals: true
        }
      };

      if (savedAmplitudeUserId) {
        window.amplitude.init("149c1b2572d16bf0d4035a897f1abfca", savedAmplitudeUserId, amplitudeConfig);
      } else {
        window.amplitude.init("149c1b2572d16bf0d4035a897f1abfca", amplitudeConfig);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
