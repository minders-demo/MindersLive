name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript
        run: npm run lint

      - name: Validate Amplitude Experiment configuration
        env:
          VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY: ${{ vars.VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY }}
          VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY: ${{ vars.VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY }}
        run: |
          if [ -z "$VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY" ]; then
            echo "::error::Falta la variable VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY en GitHub Actions."
            exit 1
          fi

          if [ "$VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY" = "149c1b2572d16bf0d4035a897f1abfca" ]; then
            echo "::error::La clave configurada es la API Key de Analytics. Debes usar el Client Deployment Key de Amplitude Experiment."
            exit 1
          fi

          if [ "$VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY" != "exp-home-01-live-demand-cards" ]; then
            echo "::error::VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY debe ser exp-home-01-live-demand-cards."
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY: ${{ vars.VITE_AMPLITUDE_EXPERIMENT_DEPLOYMENT_KEY }}
          VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY: ${{ vars.VITE_AMPLITUDE_EXPERIMENT_FLAG_KEY }}

      - name: Create SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
